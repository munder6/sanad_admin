name: Deploy Admin (Production)

# FULL-AUTO: push to `main` -> build with the production base path + production API,
# back up the current production folder, then deploy. No approval gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /sanad-admin
      NEXT_PUBLIC_API_BASE_URL: https://wewill.tech/sanad-api/api
      REWRITE_BASE: /sanad-admin/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify build output
        run: |
          set -e
          test -f out/index.html
          test -d out/_next
          # assets must be prefixed with the production base path...
          grep -q "${NEXT_PUBLIC_BASE_PATH}/_next/" out/index.html
          # ...and the production API URL must be inlined into the bundle.
          grep -rqF "$NEXT_PUBLIC_API_BASE_URL" out/_next/static
          echo "✓ build verified: base path + API URL inlined"

      - name: Deploy to production (backs up first)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET_DIR: ${{ secrets.PROD_ADMIN_DIR }}
          BACKUP: '1'
        run: bash deploy/deploy.sh
